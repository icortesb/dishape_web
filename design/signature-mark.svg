<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- dishape: a lowercase "d" from a disc and a rounded bar; the counter is a true hole. -->
  <mask id="counter"><rect width="100" height="100" fill="#fff"/><circle cx="40" cy="62" r="13" fill="#000"/></mask>
  <g mask="url(#counter)">
    <circle cx="40" cy="62" r="32" fill="#ff5b1f"/>
    <rect x="60" y="4" width="20" height="90" rx="10" fill="#c93d0a"/>
  </g>
</svg>
