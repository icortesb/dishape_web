<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of public/og.png and og-en.png. Rendered by design/render-brand.mjs. -->
<style>

  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #ececec; font-family: Geist, sans-serif; color: #111; padding: 28px; }
  .sheet { position: relative; width: 100%; height: 100%; background: #fff; border-radius: 6px; overflow: hidden; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 500; letter-spacing: -0.03em; }
  .brand i { font-style: normal; color: #c2410c; }
  h1 { font-size: 72px; line-height: 1.02; font-weight: 500; letter-spacing: -0.045em; position: relative; z-index: 1; }
  h1 span { display: block; }
  .url { font-size: 24px; color: #555; letter-spacing: -0.01em; }
  .mark { position: absolute; right: -40px; bottom: -80px; width: 440px; height: 440px; }
</style></head>
<body>
  <div class="sheet">
    <div class="brand"><svg width="40" height="40" viewBox="0 0 100 100"><use href="#d"/></svg><span>dishape<i>.</i></span></div>
    <h1 id="h"></h1>
    <p class="url">dishape.dev</p>
    <svg class="mark" viewBox="0 0 100 100"><use href="#d"/></svg>
  </div>
  <svg width="0" height="0" style="position:absolute"><defs>
    <mask id="counter"><rect width="100" height="100" fill="#fff"/><circle cx="40" cy="62" r="13" fill="#000"/></mask>
    <symbol id="d" viewBox="0 0 100 100"><g mask="url(#counter)"><circle cx="40" cy="62" r="32" fill="#ff5b1f"/><rect x="60" y="4" width="20" height="90" rx="10" fill="#c93d0a"/></g></symbol>
  </defs></svg>
  <script>
    const lines = {
      es: ["Sitios web rápidos,", "bien diseñados", "y fáciles de encontrar."],
      en: ["Fast websites,", "well designed", "and easy to find."],
    }[new URLSearchParams(location.search).get("lang") || "es"];
    const indents = [0, 0.9, 0];
    document.getElementById("h").innerHTML = lines.map((l, i) => `<span style="padding-left:${indents[i]}em">${l}</span>`).join("");
  </script>
</body></html>
